name: Apply hosted review fix

on:
  push:
    branches:
      - fix/hosted-review-0.2.3
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-hosted-review-fix-0.2.3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/hosted-review-0.2.3
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Apply source and version changes
        run: node scripts/apply-hosted-review-fix-0.2.3.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate release
        run: npm run validate

      - name: Check bundle syntax
        run: node --check main.js

      - name: Remove temporary automation
        run: |
          rm scripts/apply-hosted-review-fix-0.2.3.mjs
          rm .github/workflows/apply-hosted-review-fix.yml

      - name: Commit generated fix
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Fix hosted review warnings and release 0.2.3"
          git push origin HEAD:fix/hosted-review-0.2.3
