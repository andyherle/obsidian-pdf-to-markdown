name: Feature request
description: Suggest a focused improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the PDF workflow problem, not only the proposed control.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Desired result
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Example PDF structure
      description: Do not attach a private PDF. Describe the layout or use a public test file.
